[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora-downloader"
version = "0.1.0"
description = "A modular terminal audio downloader built with Textual and yt-dlp"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "textual==8.2.8",
  "rich==15.0.0",
  "yt-dlp==2026.10.26",
  "mutagen==1.48.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sonora = "sonora.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
